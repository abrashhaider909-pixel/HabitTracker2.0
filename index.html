<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HabitPulse - Habit Tracker, Lists & Event Planner</title>
    <meta name="description" content="All-in-one productivity app with Daily Routines, Action Lists, and Event Planner with push reminders." />
    
    <!-- PWA / Android Mobile Meta -->
    <meta name="theme-color" content="#0F766E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HabitPulse" />
    <meta name="application-name" content="HabitPulse" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="HabitPulse - Habit Tracker, Lists & Event Planner" />
    <meta property="og:description" content="All-in-one productivity app with Daily Routines, Action Lists, and Event Planner with push reminders." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased font-sans selection:bg-teal-100 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('Service Worker registration skipped in current host:', err);
          });
        });
      }
    </script>
  </body>
</html>
